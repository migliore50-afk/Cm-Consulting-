<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reimposta password | CM Consulting</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/admin/admin.css"></head><body><main class="admin-shell"><section class="auth-card"><img class="auth-logo" src="/assets/images/logo-cm-consulting.webp" alt="CM Consulting"><div class="eyebrow">SICUREZZA ACCOUNT</div><h1>Reimposta password</h1><p class="muted">Inserisci una nuova password forte. Il link di recupero è gestito da Supabase Auth.</p><form id="resetForm" class="stack"><label>Nuova password<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Conferma password<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button class="btn primary" type="submit">SALVA NUOVA PASSWORD</button></form><div id="msg" class="message" aria-live="polite"></div><a class="link-btn" href="/admin">Torna all'Area Riservata</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script>async function run(){const r=await fetch('/api/admin?action=public-config');const c=await r.json();if(!c.ok)throw new Error('Configurazione non disponibile.');window.cmSupabase=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:true}});window.cmSupabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)window.cmSupabase.session=session;});}run().catch(e=>document.getElementById('msg').textContent=e.message);document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c){msg.textContent='Le password non coincidono.';return;}if(!window.cmSupabase){msg.textContent='Sessione di recupero non disponibile.';return;}const {error}=await window.cmSupabase.auth.updateUser({password:p});if(error){msg.textContent=error.message;return;}msg.textContent='Password modificata. Ora puoi accedere con la nuova password.';e.target.reset();});</script></body></html>
